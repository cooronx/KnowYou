services:
  postgres:
    image: postgres:17-alpine
    container_name: knowyou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowyou
      POSTGRES_PASSWORD: knowyou
      POSTGRES_DB: knowyou
    ports:
      - '5432:5432'
    volumes:
      - knowyou-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U knowyou -d knowyou']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  knowyou-pgdata:
